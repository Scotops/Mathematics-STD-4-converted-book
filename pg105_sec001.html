      <p class="mb-4">
        <span data-id="pg105_n0005">A square side field has a length of 70 metres.</span> <span data-id="pg105_n0006">Find the area of the field.</span>
      </p>

      <div data-id="pg105_n0007" class="mb-2 text-lg font-bold text-zinc-800 max-sm:text-base">Solution</div>
      <p data-id="pg105_n0009" class="mb-1">Side length = 70 m</p>
      <p data-id="pg105_n0010" class="mb-4">The square is drawn as follows.</p>

      <div class="mb-6 flex justify-center">
        <div class="flex flex-col items-center gap-1">
          <div class="flex flex-col items-center">
            <span class="text-sm text-gray-800">70 m</span>
            <span class="text-xl leading-none">&#x2194;</span>
          </div>
          <div class="flex items-center gap-2">
            <div class="h-[130px] w-[130px] border-2 border-gray-800"></div>
            <div class="flex flex-col items-center">
              <span class="text-xl leading-none">&#x2195;</span>
              <span class="text-sm text-gray-800">70 m</span>
            </div>
          </div>
        </div>
      </div>

      <p data-id="pg105_n0012" class="mb-1">Thus, area of a square = length &#xd7; length.</p>
      <p data-id="pg105_n0013" class="mb-1 pl-24 max-sm:pl-6">= 70 m &#xd7; 70 m</p>
      <p data-id="pg105_n0014" class="mb-4 pl-24 max-sm:pl-6">= 4900 m&#xb2;.</p>

      <p data-id="pg105_n0016">Therefore, the area of the field is 4900 m&#xb2;.</p>
